[workspace]
members = [
	"crates/trust_repair_core",
	"crates/trust_repair_windows",
	"crates/trust_repair_app",
]
exclude = ["docs/examples", "artifacts/design-probe"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Shunji Ogawa"]
license = "Apache-2.0"
publish = false

[workspace.dependencies]
trust_repair_core = { path = "crates/trust_repair_core", version = "=0.1.0" }
trust_repair_windows = { path = "crates/trust_repair_windows", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
base64 = "=0.22.1"
x509-parser = { version = "=0.18.1", default-features = false }
zeroize = "=1.8.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_SystemInformation"] }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu"] }
rfd = { version = "=0.17.2", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
# 承認済み規約のタブ幅4とブロックdoc commentのインデントを保持する
tabs_in_doc_comments = "allow"

# release でも数値境界の検出を保ち、panic は既定の unwind とする
[profile.release]
overflow-checks = true
